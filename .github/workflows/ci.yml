name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/runtime_surface_audit.py
      - run: python scripts/archive_check.py .

  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - run: make -C native clean test
        env:
          CC: ${{ matrix.cc }}
      - run: make -C native test-asan
        env:
          CC: ${{ matrix.cc }}
      - run: make -C native test-ubsan
        env:
          CC: ${{ matrix.cc }}

  cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: cp tests/data/binary32_vectors.json /tmp/binary32_vectors.json
      - run: python scripts/generate_binary32_vectors.py --output tests/data/binary32_vectors.json
      - run: cmp /tmp/binary32_vectors.json tests/data/binary32_vectors.json

  aegis-suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: make aegis-test
      - run: make aegis-suite-check
      - run: make c2r-test
